[package]
name = "emurv"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "emurv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicorn-engine = "2.1.5"
thiserror = "2.0.18"
object = { version = "0.39.1", default-features = false, features = ["write_core", "elf", "std"] }
tauri-plugin-dialog = "2.7.1"
# Stub GDB (RP6): SOLO detrás de la feature opcional `gdb` — la app Tauri
# compila sin ella y su build/bundle no cambian un byte (gate RNF-04).
udbserver = { version = "0.3", optional = true }

[features]
gdb = ["dep:udbserver"]


