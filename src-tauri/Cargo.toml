[package]
name = "emurv"
default-run = "emurv"
version = "0.1.0"
description = "EmuRV — entorno educativo de programación en ensamblador RISC-V (TFG FIUNI)"
authors = ["Enrique Ríos Chyrnia"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "emurv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicorn-engine = "2.1.5"
thiserror = "2.0.18"
capstone = { version = "0.14", default-features = false, features = ["std", "full", "arch_riscv"] }
object = { version = "0.39.1", default-features = false, features = ["read_core", "write_core", "elf", "std"] }
tauri-plugin-dialog = "2.7.1"
# Stub GDB (RP6): SOLO detrás de la feature opcional `gdb` — la app Tauri
# compila sin ella y su build/bundle no cambian un byte (gate RNF-04).
udbserver = { path = "../vendor/udbserver", optional = true }

[[bin]]
name = "riscof_runner"
path = "tools/riscof_runner.rs"
required-features = ["riscof-runner"]

[features]
riscof-runner = []
gdb = ["dep:udbserver"]

# Copia vendorizada de unicorn-engine-sys 2.1.5 con un parche mínimo en su
# CMakeLists.txt para permitir el cross-compile macOS -> Windows (cargo-xwin);
# ver comentario "EmuRV patch" en vendor/unicorn-engine-sys/CMakeLists.txt.
[patch.crates-io]
unicorn-engine-sys = { path = "../vendor/unicorn-engine-sys" }


