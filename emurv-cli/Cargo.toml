# emurv-cli — binario headless de EmuRV (RP-3), crate SEPARADO del paquete
# Tauri a propósito: el bundler de Tauri empaqueta TODO [[bin]] del paquete
# (verificado 2026-06-12: la .app pasó de 21 a 34 MB violando RNF-04, y no
# hay opt-out — sin el artefacto el bundler corta con error). Ver BITACORA
