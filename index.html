<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- tokens ANTES de styles.css: define las variables que styles consume (RP17) -->
    <link rel="stylesheet" href="/src/temas/tokens.css" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EmuRV</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app">
      <header id="toolbar"></header>
      <main id="editor"></main>
      <aside id="lateral">
        <section id="panel-video" class="panel" hidden>
          <h2 class="panel-titulo-con-boton">
            <span data-i18n="panel.video"></span>
            <button id="video-desacoplar" data-i18n-title="video.desacoplar">⧉</button>
          </h2>
          <div class="panel-cuerpo">
            <canvas id="video-canvas" width="320" height="240"></canvas>
          </div>
        </section>
        <section id="panel-registros" class="panel">
          <h2 data-i18n="panel.registros"></h2>
          <div class="panel-cuerpo" id="registros"></div>
        </section>
        <section id="panel-memoria" class="panel">
          <h2 data-i18n="panel.memoria"></h2>
          <div class="panel-cuerpo" id="memoria"></div>
        </section>
        <section id="panel-depuracion" class="panel colapsado">
          <h2 class="panel-titulo-con-nota">
            <span data-i18n="panel.depuracion"></span>
            <span class="panel-nota" data-i18n="panel.depuracion.nota"></span>
          </h2>
          <div class="panel-cuerpo" id="depuracion"></div>
        </section>
      </aside>
      <section id="panel-consola" class="panel">
        <h2 data-i18n="panel.consola"></h2>
        <div class="panel-cuerpo" id="consola"></div>
      </section>
      <footer id="estado"></footer>
    </div>
  </body>
</html>
