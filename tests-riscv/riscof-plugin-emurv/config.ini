# RISCOF RT-3 — DUT EmuRV vs referencia Sail 0.13.
# Rutas relativas a ESTE directorio: scripts/run-riscof.sh hace cd acá
# antes de invocar riscof (los plugins las vuelven absolutas en __init__).

[RISCOF]
ReferencePlugin=sail
ReferencePluginPath=./sail
DUTPlugin=emurv
DUTPluginPath=./emurv

[emurv]
pluginpath=./emurv
ispec=./emurv/emurv_isa.yaml
pspec=./emurv/emurv_platform.yaml
PATH=../../src-tauri/target/release
target_run=1
jobs=8

[sail]
pluginpath=./sail
PATH=../.tools/sail-riscv-Mac-arm64/bin
jobs=8
